name: WebMCP Tool Lab

on:
  pull_request:
    branches: [main]
    paths: &lab_paths
      - ".github/workflows/webmcp-tool-lab.yml"
      - "cli/**"
      - "scripts/test-webmcp-tool-lab.py"
      - "worker/package*.json"
      - "worker/public/demo/**"
      - "worker/src/**"
      - "worker/wrangler.toml"
  push:
    branches: [main]
    paths: *lab_paths

permissions:
  contents: read

jobs:
  native-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Playwright
        run: python -m pip install playwright==1.62.0
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci
      - name: Get Chrome for Testing 160
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            https://storage.googleapis.com/chrome-for-testing-public/160.0.8183.0/linux64/chrome-headless-shell-linux64.zip \
            -o "$RUNNER_TEMP/wmcp-chrome.zip"
          unzip -q "$RUNNER_TEMP/wmcp-chrome.zip" -d "$RUNNER_TEMP"
          # Match Playwright's launch mode for this disposable runner and loopback-only fixture.
          cat > "$RUNNER_TEMP/wmcp-fixture-chrome" <<'SH'
          #!/bin/sh
          exec "$RUNNER_TEMP/chrome-headless-shell-linux64/chrome-headless-shell" --no-sandbox "$@"
          SH
          chmod u+x "$RUNNER_TEMP/wmcp-fixture-chrome"
      - name: Test real browser behavior and Doctor drift
        run: python scripts/test-webmcp-tool-lab.py --chrome "$RUNNER_TEMP/wmcp-fixture-chrome"
      - name: Verify demo navigation and native tools through Wrangler
        shell: bash
        run: |
          set -euo pipefail
          origin=http://127.0.0.1:8766
          log="$RUNNER_TEMP/wmcp-tool-lab-worker.log"
          worker/node_modules/.bin/wrangler dev --config worker/wrangler.toml --local --ip 127.0.0.1 --port 8766 > "$log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fs "$origin/api/v1/health" >/dev/null; then
              python scripts/test-webmcp-tool-lab.py --origin "$origin" --chrome "$RUNNER_TEMP/wmcp-fixture-chrome"
              exit 0
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$log"
          exit 1
