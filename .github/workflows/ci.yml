name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: npm install
      # One honest gate. `npm run verify` is `tsc --noEmit && vitest run`: the &&
      # hard-fails the job on a type error OR a test failure. No `|| fallback`
      # that could mask a red build (that masking is what let a broken tsc merge).
      - name: Verify (typecheck + tests)
        run: npm run verify

  developer-quickstart:
    name: read-only CLI + native demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check CLI JavaScript syntax
        run: node --check cli/wmcp.mjs
      - name: Test CLI and browser demo
        run: node --test cli/*.test.mjs actions/mcp-doctor/*.test.mjs

  doctor-action-smoke:
    name: reusable MCP Doctor GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start local read-only MCP fixture
        shell: bash
        run: |
          set -euo pipefail
          node actions/mcp-doctor/smoke-server.mjs > "$RUNNER_TEMP/mcp-doctor-smoke.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/mcp-doctor-smoke.log"
          exit 1
      - name: Verify local endpoint through reusable composite action
        uses: ./actions/mcp-doctor
        with:
          endpoint: http://127.0.0.1:8765/mcp
          strict: "true"
