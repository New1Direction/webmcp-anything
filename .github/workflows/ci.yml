name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  browser-sdk:
    name: Browser SDK package and runtime selection
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/effect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run
      - run: python -m pip install playwright==1.62.0
      - run: python test/selector.py "$(command -v google-chrome)"
      - name: Taskboard journey with the WMCP browser core
        run: python ../../scripts/test-taskboard-affordances.py --journey --polyfill dist/webmcp.min.js

  admin-lean:
    name: Admin and selection models (Lean)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/wmcp-admin/formal
    steps:
      - uses: actions/checkout@v4
      - name: Check Lean proofs and shared test cases
        shell: bash
        run: |
          version="$(cut -d: -f2 lean-toolchain)"
          archive="lean-${version#v}-linux.tar.zst"
          curl --fail --silent --show-error --location "https://github.com/leanprover/lean4/releases/download/${version}/${archive}" -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' '2b7ab1ed8b92d2e6abfaf41344823b510064dbc9c0260cac73eb496ab2dea6eb' "$RUNNER_TEMP/$archive" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/${archive%.tar.zst}/bin/lean" --run Safety.lean > "$RUNNER_TEMP/admin-confirmation.tsv"
          diff -u confirmation.tsv "$RUNNER_TEMP/admin-confirmation.tsv"
          "$RUNNER_TEMP/${archive%.tar.zst}/bin/lean" --run Safety.lean retry > "$RUNNER_TEMP/admin-retry.tsv"
          diff -u retry.tsv "$RUNNER_TEMP/admin-retry.tsv"
          "$RUNNER_TEMP/${archive%.tar.zst}/bin/lean" --run ../../wmcp-stats/formal/Counts.lean > "$RUNNER_TEMP/selection-counts.tsv"
          diff -u ../../wmcp-stats/formal/counts.tsv "$RUNNER_TEMP/selection-counts.tsv"

  admin-cli:
    name: Rust admin CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/wmcp-admin
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --check
      - name: Test
        run: cargo test --locked

  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: npm install
      # One honest gate. `npm run verify` is `tsc --noEmit && vitest run`: the &&
      # hard-fails the job on a type error OR a test failure. No `|| fallback`
      # that could mask a red build (that masking is what let a broken tsc merge).
      - name: Verify (typecheck + tests)
        run: npm run verify

  developer-quickstart:
    name: read-only CLI + native demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check CLI JavaScript syntax
        run: node --check cli/wmcp.mjs
      - name: Test and build Rust selection engine
        run: |
          cargo fmt --check --manifest-path tools/wmcp-stats/Cargo.toml
          cargo test --locked --manifest-path tools/wmcp-stats/Cargo.toml
          cargo build --locked --manifest-path tools/wmcp-stats/Cargo.toml
      - name: Test CLI and browser demo
        run: node --test cli/*.test.mjs actions/mcp-doctor/*.test.mjs

  doctor-action-smoke:
    name: reusable MCP Doctor GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start local read-only MCP fixture
        shell: bash
        run: |
          set -euo pipefail
          node actions/mcp-doctor/smoke-server.mjs > "$RUNNER_TEMP/mcp-doctor-smoke.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/mcp-doctor-smoke.log"
          exit 1
      - name: Verify local endpoint through reusable composite action
        uses: ./actions/mcp-doctor
        with:
          endpoint: http://127.0.0.1:8765/mcp
          strict: "true"
      - name: Verify browser page and paired endpoint through the same composite action
        uses: ./actions/mcp-doctor
        with:
          page: http://127.0.0.1:8765/web
          paired-endpoint: http://127.0.0.1:8765/mcp
          strict: "true"

  webmcp-native:
    name: native Chrome WebMCP regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci
      - name: Verify the legacy failure and fixed shim in Chrome
        working-directory: worker
        run: |
          export WMCP_CHROME="$(command -v google-chrome)"
          test -x "$WMCP_CHROME"
          "$WMCP_CHROME" --version
          npm test -- test/webmcp_native.test.ts

  browser-acceptance:
    name: Chromium WebMCP acceptance (simulated native API)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install worker and browser test dependencies
        run: |
          npm install
          npm install --no-save playwright@1.56.1
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise actual browser DOM bridge
        run: node --test --test-concurrency=1 test/webmcp_browser.acceptance.mjs test/webmcp_mv3.acceptance.mjs
