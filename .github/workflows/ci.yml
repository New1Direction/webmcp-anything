name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: npm install
      # One honest gate. `npm run verify` is `tsc --noEmit && vitest run`: the &&
      # hard-fails the job on a type error OR a test failure. No `|| fallback`
      # that could mask a red build (that masking is what let a broken tsc merge).
      - name: Verify (typecheck + tests)
        run: npm run verify

  developer-quickstart:
    name: read-only CLI + native demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check CLI JavaScript syntax
        run: node --check cli/wmcp.mjs
      - name: Test CLI and browser demo
        run: node --test cli/*.test.mjs

  browser-acceptance:
    name: Chromium WebMCP acceptance (simulated native API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install worker and browser test dependencies
        run: |
          npm install
          npm install --no-save playwright@1.56.1
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise actual browser DOM bridge
        run: node --test --test-concurrency=1 test/webmcp_browser.acceptance.mjs test/webmcp_mv3.acceptance.mjs
