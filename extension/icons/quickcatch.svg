<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="QuickCatch">
  <!-- speed marks (motion / "quick") -->
  <g stroke="#1d1d24" stroke-width="7" stroke-linecap="round">
    <line x1="104" y1="28" x2="118" y2="20"/>
    <line x1="109" y1="43" x2="123" y2="38"/>
    <line x1="111" y1="59" x2="125" y2="57"/>
  </g>

  <!-- catch disc -->
  <circle cx="60" cy="66" r="50" fill="#1d1d24"/>
  <circle cx="60" cy="66" r="43" fill="#ff8a1e"/>

  <!-- crosshair / lock-on ring -->
  <circle cx="60" cy="66" r="30" fill="none" stroke="#ffffff" stroke-width="5"/>
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line x1="60" y1="14" x2="60" y2="30"/>
    <line x1="60" y1="102" x2="60" y2="118"/>
    <line x1="8" y1="66" x2="24" y2="66"/>
    <line x1="96" y1="66" x2="112" y2="66"/>
  </g>

  <!-- center lens -->
  <circle cx="60" cy="66" r="20" fill="#15151b"/>
  <!-- vector "Q" (ring + tail) — font-independent, renders in any tool -->
  <circle cx="60" cy="64" r="11" fill="none" stroke="#ff8a1e" stroke-width="5"/>
  <line x1="63" y1="69" x2="72" y2="80" stroke="#ff8a1e" stroke-width="6" stroke-linecap="round"/>
</svg>
