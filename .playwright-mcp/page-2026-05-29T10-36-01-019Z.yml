      - heading "wmcp.sh vs Zapier." [level=1] [ref=e16]
      - paragraph [ref=e17]: Zapier is the no-code workflow incumbent — 6000+ apps, mature UX, the original "when X, do Y." wmcp.sh is the agent-facing tool layer — Claude / Cursor / Codex call MCP tools, not pre-defined Zaps. Different jobs, often complementary.
