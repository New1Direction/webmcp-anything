      - heading "The honest version." [level=2] [ref=e85]
      - generic [ref=e86]:
        - generic [ref=e87]:
          - heading "Zapier wins when:" [level=3] [ref=e88]
          - list [ref=e89]:
            - listitem [ref=e90]: You're a non-technical team automating cross-app workflows
            - listitem [ref=e91]: You need 6000+ pre-built apps with hand-curated UX
            - listitem [ref=e92]: Trigger-based automation is the job (not agent tool-use)
            - listitem [ref=e93]: You want the most mature, reliable no-code workflow platform
        - generic [ref=e94]:
          - heading "wmcp.sh wins when:" [level=3] [ref=e95]
          - list [ref=e96]:
            - listitem [ref=e97]: You're building an AI agent that needs MCP tools (Claude.ai connector, Cursor, Codex)
            - listitem [ref=e98]: You need MCP-native — Zapier MCP is a thin wrapper; wmcp.sh is built for it
            - listitem [ref=e99]: You need shopper-side, oracle, or DeFi (Zapier doesn't ship these)
            - listitem [ref=e100]: You want a 100/day anonymous free tier with no signup
            - listitem [ref=e101]: You want OAuth-proxy for OAuth-gated MCP servers
