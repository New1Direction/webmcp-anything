    - banner [ref=e13]:
      - generic [ref=e14]: integration · Next.js
      - heading "Next.js MCP integration." [level=1] [ref=e16]
      - paragraph [ref=e17]: Your Next.js 15 app already has API routes; here's how to expose them as MCP tools without rewriting a single handler. Publish an OpenAPI spec, point wmcp.sh at it, and any MCP-compatible agent (Claude Desktop, Cursor, Codex) gets typed tools.
      - paragraph [ref=e18]: wmcp.sh is not affiliated with Vercel or Anthropic. App Router and Route Handlers are Next.js features.
    - generic [ref=e19]:
      - generic [ref=e20]: The gap
      - heading "You have the API. You don't have the MCP server." [level=2] [ref=e21]
      - generic [ref=e22]:
        - generic [ref=e23]:
          - heading "What you have today" [level=3] [ref=e24]
          - paragraph [ref=e25]:
            - text: Route Handlers under
            - code [ref=e26]: app/api/**/route.ts
            - text: serving your web app, with typed inputs (Zod, valibot, or hand-rolled), Vercel deployment, and probably some Zod-to-OpenAPI generator emitting a spec.
        - generic [ref=e27]:
          - heading "What agents need" [level=3] [ref=e28]
          - paragraph [ref=e29]: A Model Context Protocol server exposing each route as a tool with JSON Schema inputs and structured outputs. wmcp.sh generates it from your existing OpenAPI doc — no new handler, no new framework.
    - generic [ref=e30]:
      - generic [ref=e31]: The wiring
      - heading "One Route Handler, exposed as a tool." [level=2] [ref=e32]
      - paragraph [ref=e33]: A real, runnable example. The handler is plain Next.js 15; the OpenAPI bit is what wmcp.sh ingests.
      - code [ref=e35]: "// app/api/quotes/route.ts — Next.js 15 App Router import { NextResponse } from 'next/server'; import { z } from 'zod'; export const runtime = 'edge'; const QuoteInput = z.object({ symbol: z.string().min(1).max(12), size: z.number().positive(), }); export async function POST(req: Request) { const body = QuoteInput.parse(await req.json()); const mid = await fetchMid(body.symbol); return NextResponse.json({ symbol: body.symbol, bid: mid * 0.999, ask: mid * 1.001, size: body.size, issued_at: new Date().toISOString(), }); } // Publish OpenAPI at /api/openapi (next-rest-framework, zod-to-openapi, or hand-rolled). // Then point wmcp.sh at https://acme.example.com/api/openapi and every route // becomes an MCP tool the agent can call."
      - paragraph [ref=e36]:
        - text: "Once the spec is live, register it once:"
        - code [ref=e37]: curl 'http://localhost:8799/api/v1/tools?url=https://acme.example.com/api/openapi'
        - text: . See
        - link "/integration/openapi" [ref=e38] [cursor=pointer]:
          - /url: /integration/openapi
        - text: for the full spec-ingest contract.
