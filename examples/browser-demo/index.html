<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Taskboard · WMCP</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0c1218; color: #edf2f4; line-height: 1.5 }
    * { box-sizing: border-box }
    body { margin: 0 }
    main { width: min(100% - 2rem, 44rem); margin: clamp(2rem, 8vw, 5rem) auto }
    h1, h2 { line-height: 1.15; margin: 0 0 .75rem }
    h1 { font-size: clamp(2rem, 7vw, 3.25rem); letter-spacing: -.045em }
    h2 { font-size: 1.2rem }
    p { margin: .5rem 0 }
    a { color: #a6e9d6 }
    .hint, footer { color: #adbac3; font-size: .9rem }
    section { margin: 1.75rem 0; padding: clamp(1rem, 5vw, 1.6rem); border: 1px solid #364451; border-radius: 1rem; background: #141e27 }
    section > h2 { margin-bottom: 1rem }
    label { display: block; font-weight: 650 }
    .form-row { display: flex; flex-wrap: wrap; align-items: start; gap: .75rem; margin-top: .5rem }
    input, button { font: inherit; min-height: 2.75rem; border-radius: .55rem; padding: .5rem .8rem }
    input { flex: 1 1 12rem; min-width: 0; max-width: 100%; color: inherit; background: #0a1016; border: 1px solid #768894 }
    button { cursor: pointer; font-weight: 650; background: #a6e9d6; color: #10251f; border: 1px solid transparent }
    .secondary { color: #e1edf1; background: #263541; border-color: #738490 }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid #ffdc89; outline-offset: 3px }
    .message { min-height: 1.5em; overflow-wrap: anywhere }
    .error { color: #ffb7ad }
    .error:empty { margin: 0; min-height: 0 }
    [aria-invalid="true"] { border-color: #ffb7ad }
    ol { list-style: none; padding: 0; margin: 0; display: grid; gap: .65rem }
    .task { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; padding: .75rem; border: 1px solid #425360; border-radius: .65rem }
    .task-body { flex: 1 1 12rem; min-width: 0; overflow-wrap: anywhere }
    .id { color: #a6e9d6; font-variant-numeric: tabular-nums; font-size: .8em }
    .state { display: block; color: #adbac3; font-size: .82rem }
    dialog { width: min(100% - 2rem, 30rem); padding: 1.25rem; color: inherit; background: #141e27; border: 1px solid #738490; border-radius: .8rem }
    dialog::backdrop { background: #080e13d9 }
    dialog p { overflow-wrap: anywhere }
    .dialog-actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1rem }
    footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .6rem }
  </style>
</head>
<body>
<main>
  <h1>Taskboard</h1>
  <p class="hint">Tasks stay in this tab.</p>

  <section aria-labelledby="add-heading">
    <h2 id="add-heading">New task</h2>
    <form id="form" novalidate>
      <label for="task">Task name</label>
      <p id="task-hint" class="hint">Use 1 to 120 characters on one line.</p>
      <div class="form-row">
        <input id="task" name="task" required aria-describedby="task-hint task-error" autocomplete="off">
        <button id="add-task" type="submit">Add task</button>
      </div>
      <p id="task-error" class="message error" role="alert"></p>
    </form>
    <p id="feedback" class="message" role="status"></p>
  </section>

  <section aria-labelledby="tasks-heading">
    <h2 id="tasks-heading">Tasks</h2>
    <ol id="list" role="list" aria-labelledby="tasks-heading"></ol>
  </section>

  <footer>
    <span id="status">Checking agent tools…</span>
    <a href="https://github.com/New1Direction/webmcp-anything">Source on GitHub</a>
  </footer>
</main>

<dialog id="agent-review" aria-labelledby="review-title" aria-describedby="review-detail">
  <h2 id="review-title">Review agent request</h2>
  <p id="review-detail"></p>
  <div class="dialog-actions">
    <button id="review-cancel" class="secondary" type="button" autofocus>Cancel</button>
    <button id="review-approve" type="button"></button>
  </div>
</dialog>

<script>
(() => {
  const get = (id) => document.getElementById(id);
  const list = get("list");
  const input = get("task");
  const feedback = get("feedback");
  const error = get("task-error");
  const status = get("status");
  const dialog = get("agent-review");
  const approve = get("review-approve");
  const controller = new AbortController();
  const titles = { list: get("tasks-heading").textContent, add: get("add-task").textContent, complete: "Mark complete" };
  const namePattern = "^(?!\\s*$)[^\\r\\n]+$";
  const validName = new RegExp(namePattern, "u");
  const tasks = [
    { id: 1, text: "Explore the WebMCP API", done: false },
    { id: 2, text: "Try an agent tool call", done: false },
  ];
  const rows = new Map();
  let nextId = 3;
  let pendingReview;

  function checkName(value) {
    if (typeof value !== "string" || !value.trim()) throw Error("Enter a task name.");
    if (!validName.test(value)) throw Error("Use one line for the task name.");
    if ([...value].length > 120) throw Error("Use 120 characters or fewer.");
    return value.trim();
  }

  function openTask(id) {
    if (!Number.isSafeInteger(id) || id < 1) throw Error("Use the Task ID shown beside the task.");
    const task = tasks.find((candidate) => candidate.id === id);
    if (!task) throw Error("Task #" + id + " could not be found.");
    if (task.done) throw Error("Task #" + id + " is already completed.");
    return task;
  }

  function nextFocus(id) {
    const earlier = tasks.filter((task) => task.id < id && !task.done).at(-1);
    const next = tasks.find((task) => task.id > id && !task.done) ?? earlier;
    (next ? rows.get(next.id).button : input).focus();
  }

  function completeTask(id) {
    const task = openTask(id);
    const row = rows.get(id);
    const hadFocus = document.activeElement === row.button;
    task.done = true;
    row.state.textContent = "Completed";
    row.button.remove();
    if (hadFocus) nextFocus(id);
    feedback.textContent = "Completed task #" + id + ", " + task.text + ".";
    return task;
  }

  function appendTask(task) {
    const row = document.createElement("li");
    row.className = "task";
    const body = document.createElement("div");
    body.className = "task-body";
    const number = document.createElement("span");
    number.id = "task-number-" + task.id;
    number.className = "id";
    number.textContent = "#" + task.id;
    const name = document.createElement("span");
    name.id = "task-name-" + task.id;
    name.textContent = task.text;
    const state = document.createElement("span");
    state.className = "state";
    state.textContent = "Open";
    body.append(number, " ", name, state);
    const button = document.createElement("button");
    button.type = "button";
    button.className = "secondary";
    button.id = "complete-" + task.id;
    button.textContent = titles.complete;
    button.setAttribute("aria-labelledby", button.id + " " + name.id + " " + number.id);
    button.addEventListener("click", () => completeTask(task.id));
    row.append(body, button);
    list.append(row);
    rows.set(task.id, { button, state });
  }

  function addTask(text) {
    const task = { id: nextId++, text, done: false };
    tasks.push(task);
    appendTask(task);
    feedback.textContent = "Added task #" + task.id + ", " + task.text + ".";
    return task;
  }

  get("form").addEventListener("submit", (event) => {
    event.preventDefault();
    try {
      const name = checkName(input.value);
      error.textContent = "";
      input.removeAttribute("aria-invalid");
      addTask(name);
      input.value = "";
    } catch (failure) {
      feedback.textContent = "";
      input.setAttribute("aria-invalid", "true");
      error.textContent = failure.message;
    }
    input.focus();
  });
  input.addEventListener("input", () => {
    if (error.textContent) {
      error.textContent = "";
      input.removeAttribute("aria-invalid");
    }
  });
  tasks.forEach(appendTask);

  function finishReview(allowed) {
    const review = pendingReview;
    if (!review) return;
    pendingReview = undefined;
    review.removeAbortListener();
    if (dialog.open) dialog.close();
    if (allowed && !controller.signal.aborted) review.resolve();
    else review.reject(Error("Agent request canceled."));
  }

  function reviewAction(title, detail, signal) {
    signal?.throwIfAborted();
    if (controller.signal.aborted) throw Error("This taskboard is no longer active.");
    if (pendingReview) throw Error("Another agent request is awaiting a decision.");
    get("review-detail").textContent = detail;
    approve.textContent = title;
    return new Promise((resolve, reject) => {
      const onAbort = () => finishReview(false);
      const removeAbortListener = () => signal?.removeEventListener("abort", onAbort);
      pendingReview = { resolve, reject, removeAbortListener };
      signal?.addEventListener("abort", onAbort, { once: true });
      try { dialog.showModal(); }
      catch (failure) {
        pendingReview = undefined;
        removeAbortListener();
        reject(failure);
      }
    });
  }

  get("review-cancel").addEventListener("click", () => finishReview(false));
  approve.addEventListener("click", (event) => {
    if (event.isTrusted) finishReview(true);
  });
  dialog.addEventListener("cancel", (event) => {
    event.preventDefault();
    finishReview(false);
  });
  dialog.addEventListener("close", () => {
    if (!dialog.open) finishReview(false);
  });
  window.addEventListener("pagehide", () => {
    controller.abort();
    finishReview(false);
  }, { once: true });

  const ctx = document.modelContext;
  if (!ctx || typeof ctx.registerTool !== "function") {
    status.textContent = "Agent tools unavailable in this browser.";
    return;
  }
  function argument(inputObject, key) {
    if (!inputObject || typeof inputObject !== "object" || Array.isArray(inputObject) ||
        Object.keys(inputObject).length !== (key === undefined ? 0 : 1) ||
        (key !== undefined && !Object.hasOwn(inputObject, key))) {
      throw Error(key === undefined ? "This tool takes no arguments." : "Provide only the " + key + " argument.");
    }
    return inputObject[key];
  }
  const result = (value) => ({ content: [{ type: "text", text: JSON.stringify(value) }] });
  const tools = [
    { name: "list_tasks", title: titles.list, description: titles.list + ". Read the names, IDs, and completion states of tasks in this tab.",
      annotations: { readOnlyHint: true, untrustedContentHint: true },
      inputSchema: { type: "object", properties: {}, additionalProperties: false },
      execute: async (inputObject) => {
        argument(inputObject);
        return result(tasks);
      } },
    { name: "add_task", title: titles.add, description: titles.add + ". Create an open task from its Task name. Requires confirmation in this tab.",
      annotations: { readOnlyHint: false, untrustedContentHint: true },
      inputSchema: { type: "object", properties: {
        text: { type: "string", description: "Task name", minLength: 1, maxLength: 120, pattern: namePattern },
      }, required: ["text"], additionalProperties: false },
      execute: async (inputObject, options) => {
        const name = checkName(argument(inputObject, "text"));
        const signal = options?.signal;
        await reviewAction(titles.add, "Add task “" + name + "”?", signal);
        signal?.throwIfAborted();
        controller.signal.throwIfAborted();
        return result(addTask(name));
      } },
    { name: "complete_task", title: titles.complete, description: titles.complete + ". Complete an open task by its Task ID. Requires confirmation in this tab.",
      annotations: { readOnlyHint: false, untrustedContentHint: true },
      inputSchema: { type: "object", properties: {
        id: { type: "integer", description: "Task ID shown beside the task", minimum: 1, maximum: Number.MAX_SAFE_INTEGER },
      }, required: ["id"], additionalProperties: false },
      execute: async (inputObject, options) => {
        const id = argument(inputObject, "id");
        const task = openTask(id);
        const signal = options?.signal;
        await reviewAction(titles.complete, "Mark complete for task #" + id + ", “" + task.text + "”?", signal);
        signal?.throwIfAborted();
        controller.signal.throwIfAborted();
        return result(completeTask(id));
      } },
  ];
  Promise.allSettled(tools.map((tool) => ctx.registerTool(tool, { signal: controller.signal })))
    .then((registrations) => {
      const count = registrations.filter((registration) => registration.status === "fulfilled").length;
      status.textContent = count + " of " + tools.length + " agent tools available.";
    });
})();
</script>
</body>
</html>
